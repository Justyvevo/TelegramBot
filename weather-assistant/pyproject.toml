[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artemii-weather-assistant"
version = "0.1.0"
description = "A city-level weather assistant with practical clothing guidance and opt-in notifications."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["ruff==0.16.6"]

[project.scripts]
weather-assistant = "weather_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FakeSession must implement the aiogram BaseSession timeout signature.
"tests/test_bot.py" = ["ASYNC109"]
